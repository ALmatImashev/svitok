<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Свиток</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600&family=Inter:wght@400;500;600&display=swap">

<style>
:root{--bg:#f7f4ee;--fg:#24211c;--muted:#867e71;--line:#e3dccf;--card:#fffdf8;--accent:#c2532b;--mark:#ffd86b;--fs:20px;--lh:1.65;--font:'Literata',Georgia,serif}
[data-theme=sepia]{--bg:#efe3c8;--fg:#3b2f20;--muted:#8a7658;--line:#d9c8a3;--card:#f6ecd6;--accent:#a8472a;--mark:#f0bd45}
[data-theme=dark]{--bg:#131313;--fg:#d8d3ca;--muted:#7b756b;--line:#2b2927;--card:#1d1c1b;--accent:#e07a4f;--mark:#7d5f10}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);-webkit-tap-highlight-color:transparent}
body{font-family:Inter,system-ui,sans-serif;transition:background .2s,color .2s}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.screen{display:none}.screen.on{display:block}

/* library */
.lib{max-width:640px;margin:0 auto;padding:calc(32px + env(safe-area-inset-top)) 20px calc(40px + env(safe-area-inset-bottom))}
.brand{font-family:Literata,serif;font-size:36px;font-weight:600;letter-spacing:-.02em;margin:0}
.brand span{color:var(--accent)}
.tag{color:var(--muted);margin:6px 0 24px;font-size:15px;line-height:1.5}
.actions{display:flex;gap:10px;margin-bottom:28px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 18px;border-radius:12px;font-weight:500;font-size:15px}
.btn.primary{background:var(--accent);color:#fff}
.btn.ghost{border:1px solid var(--line)}
.books{display:grid;gap:12px}
.book{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:9px}
.book .open{text-align:left;display:grid;gap:4px}
.book h3{margin:0;font-family:Literata,serif;font-size:18px;font-weight:600;line-height:1.3}
.meta{color:var(--muted);font-size:13px;line-height:1.45}
.meta b{color:var(--fg);font-weight:500}
.bar{height:4px;background:var(--line);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.del{color:var(--muted);font-size:13px;padding:5px 10px;border-radius:8px}
.del.sure{color:#fff;background:#c33}
.empty{color:var(--muted);text-align:center;padding:36px 14px;border:1px dashed var(--line);border-radius:14px;font-size:14px;line-height:1.6}
.note{color:var(--muted);font-size:12px;margin-top:20px;line-height:1.5}

/* reader */
.top{position:fixed;left:0;right:0;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);padding-top:env(safe-area-inset-top);transition:transform .25s}
.top.hide{transform:translateY(-100%)}
.top .in{display:flex;align-items:center;height:48px;gap:4px;max-width:760px;margin:0 auto;padding:0 6px}
.top .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px;color:var(--muted);text-align:center}
.ib{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;flex:none}
.ib:active{background:var(--line)}
.ib:disabled{opacity:.35}
.prog{height:2px;background:var(--line)}.prog i{display:block;height:100%;width:0;background:var(--accent)}
#text{max-width:680px;margin:0 auto;padding:calc(76px + env(safe-area-inset-top)) 22px 55vh;font-family:var(--font);font-size:var(--fs);line-height:var(--lh);overflow-wrap:break-word}
#text p{margin:0 0 .85em;text-indent:1.4em;hyphens:auto;-webkit-hyphens:auto}
#text h2{font-size:1.3em;margin:2em 0 .9em;line-height:1.3;text-align:center;font-weight:600}
#text h3{font-size:1.08em;margin:1.6em 0 .6em;font-weight:600}
#text .end{text-align:center;color:var(--muted);font-size:.8em;margin-top:3em;text-indent:0}
mark.bm{background:var(--mark);color:inherit;border-radius:3px;box-shadow:0 0 0 2px var(--mark)}
mark.bm.pulse{animation:pulse 1.6s ease}
@keyframes pulse{0%,35%{box-shadow:0 0 0 9px color-mix(in srgb,var(--mark) 55%,transparent)}100%{box-shadow:0 0 0 2px var(--mark)}}
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));z-index:5;display:flex;align-items:center;gap:2px;background:color-mix(in srgb,var(--card) 94%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:17px;padding:4px;box-shadow:0 8px 28px rgba(0,0,0,.13)}
.dock .ib{width:46px;height:46px}
.sep{width:1px;height:24px;background:var(--line);margin:0 3px}
.spd{min-width:30px;text-align:center;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.play{background:var(--accent);color:#fff!important}
.play:active{background:var(--accent)!important;opacity:.85}

/* sheets */
.back{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:10;opacity:0;pointer-events:none;transition:opacity .2s}
.back.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:11;background:var(--card);border-radius:20px 20px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom));max-height:75vh;overflow:auto;transform:translateY(105%);transition:transform .25s;max-width:680px;margin:0 auto}
.sheet.on{transform:none}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 14px}
.sheet h4{margin:0 0 14px;font-size:17px;font-weight:600}
.field{margin-bottom:18px}
.field label{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);margin-bottom:8px}
input[type=range]{width:100%;accent-color:var(--accent)}
.seg{display:flex;gap:8px}
.seg button{flex:1;padding:11px 0;border-radius:11px;border:1.5px solid var(--line);font-size:14px}
.seg button.on{border-color:var(--accent);color:var(--accent);font-weight:600}
.hist{display:grid;gap:4px}
.h{display:block;width:100%;text-align:left;padding:12px;border-radius:12px;border:1px solid transparent}
.h.cur{border-color:var(--accent)}
.h:active{background:var(--line)}
.h .s{font-family:var(--font);font-size:15px;line-height:1.45}
.h .s mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 2px}
.h .d{font-size:12px;color:var(--muted);margin-top:4px}

.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translate(-50%,16px);opacity:0;pointer-events:none;z-index:20;background:var(--fg);color:var(--bg);border-radius:12px;padding:11px 14px;font-size:14px;display:flex;gap:14px;align-items:center;transition:.2s;max-width:calc(100vw - 32px);box-shadow:0 8px 24px rgba(0,0,0,.2)}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{color:var(--accent);font-weight:600;white-space:nowrap}
.toast span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.loading{position:fixed;inset:0;z-index:30;background:color-mix(in srgb,var(--bg) 85%,transparent);display:none;place-items:center;font-size:15px;color:var(--muted)}
.loading.on{display:grid}

/* auth */
.auth{max-width:400px;margin:0 auto;padding:calc(56px + env(safe-area-inset-top)) 22px 40px}
.auth form{display:grid;gap:12px;margin-top:8px}
.inp{width:100%;padding:14px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--fg);font:inherit;font-size:16px}
.inp:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.btn.wide{justify-content:center;width:100%}
.btn:disabled{opacity:.55}
.switch{color:var(--muted);font-size:14px;text-align:center;margin-top:6px}
.switch button{color:var(--accent);font-weight:500}
.msg{font-size:14px;line-height:1.5;border-radius:12px;padding:12px 14px;background:var(--card);border:1px solid var(--line)}
.msg.err{border-color:#d9534f;color:#d9534f}
.libhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.who{font-size:12px;color:var(--muted);text-align:right;line-height:1.6}
.who button{color:var(--accent);font-size:12px}
.badge{display:inline-block;font-size:11px;padding:2px 7px;border-radius:6px;background:var(--line);color:var(--muted);margin-left:6px;vertical-align:2px;font-family:Inter,system-ui,sans-serif;font-weight:500}
.sync{font-size:12px;color:var(--muted)}

/* chunk placeholders */
.more{text-align:center;color:var(--muted);font-family:Inter,system-ui,sans-serif;font-size:13px;padding:18px 0;text-indent:0!important}

/* protection for shared readers */
body.guard #text{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.wm{position:fixed;inset:0;pointer-events:none;z-index:4;display:none;opacity:.07;overflow:hidden}
body.guard .wm{display:block}
.wm div{position:absolute;white-space:nowrap;font:600 15px Inter,sans-serif;color:var(--fg);transform:rotate(-28deg)}
@media print{body{display:none!important}}
</style>
</head>

<!-- AUTH -->
<section class="screen" id="auth">
  <div class="auth">
    <h1 class="brand" data-th="brand"></h1>
    <p class="tag" data-t="authTag"></p>
    <form id="authForm" autocomplete="on">
      <input class="inp" id="email" type="email" data-tp="email" autocomplete="email" required>
      <input class="inp" id="pass" type="password" data-tp="passPh" autocomplete="current-password" minlength="6" required>
      <button class="btn primary wide" id="authBtn" type="submit"></button>
      <div id="authMsg"></div>
    </form>
    <p class="switch"><span id="swText"></span> <button id="swBtn" type="button"></button></p>
    <p class="switch"><button class="langBtn" type="button"></button></p>
  </div>
</section>

<!-- LIBRARY -->
<section class="screen" id="lib">
  <div class="lib">
    <div class="libhead">
      <h1 class="brand" data-th="brand"></h1>
      <div class="who"><div id="whoEmail"></div><button class="langBtn" type="button"></button> · <button id="logout" data-t="logout"></button></div>
    </div>
    <p class="tag" data-t="libTag"></p>
    <div class="actions">
      <label class="btn primary" for="file">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span data-t="upload"></span>
      </label>
      <input type="file" id="file" hidden>
    </div>
    <div class="books" id="books"><div class="empty" data-t="libLoading"></div></div>
    <p class="note" data-t="libNote"></p>
  </div>
</section>

<!-- READER -->
<section class="screen" id="reader">
  <div class="top" id="top">
    <div class="in">
      <button class="ib" id="backBtn" data-ta="aBack"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
      <div class="t" id="rTitle"></div>
      <button class="ib" id="setBtn" data-ta="aSettings"><svg viewBox="0 0 24 24"><path d="M4 19l5-14 5 14M6 14h6M15 19l3.5-9 3.5 9M16.3 16h4.4"/></svg></button>
    </div>
    <div class="prog"><i id="progI"></i></div>
  </div>
  <article id="text"></article>
  <div class="wm" id="wm"></div>
  <div class="dock">
    <button class="ib" id="histBtn" data-ta="aHist"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg></button>
    <button class="ib" id="toMark" data-ta="aToMark"><svg viewBox="0 0 24 24"><path d="M7 4h10v16l-5-4-5 4z"/></svg></button>
    <div class="sep"></div>
    <button class="ib" id="slower" data-ta="aSlower"><svg viewBox="0 0 24 24"><path d="M6 12h12"/></svg></button>
    <div class="spd" id="spd">4</div>
    <button class="ib" id="faster" data-ta="aFaster"><svg viewBox="0 0 24 24"><path d="M12 6v12M6 12h12"/></svg></button>
    <button class="ib play" id="playBtn" data-ta="aAuto"><svg viewBox="0 0 24 24" id="playIco"><path d="M8 5.5v13l10.5-6.5z" fill="currentColor"/></svg></button>
  </div>
</section>

<div class="back" id="back"></div>

<div class="sheet" id="setSheet">
  <div class="grab"></div>
  <h4 data-t="view"></h4>
  <div class="field"><label><span data-t="fontSize"></span> <span id="fsV"></span></label><input type="range" id="fs" min="15" max="30" step="1"></div>
  <div class="field"><label><span data-t="lineH"></span> <span id="lhV"></span></label><input type="range" id="lh" min="1.3" max="2.1" step="0.05"></div>
  <div class="field"><label data-t="font"></label><div class="seg" id="fontSeg"><button data-v="serif" data-t="serif"></button><button data-v="sans" data-t="sans"></button></div></div>
  <div class="field"><label data-t="theme"></label><div class="seg" id="themeSeg"><button data-v="light" data-t="light"></button><button data-v="sepia" data-t="sepia"></button><button data-v="dark" data-t="dark"></button></div></div>
  <div class="field"><label>Язык · Language</label><div class="seg" id="langSeg"><button data-v="ru">Русский</button><button data-v="en">English</button></div></div>
</div>

<div class="sheet" id="histSheet">
  <div class="grab"></div>
  <h4 data-t="histTitle"></h4>
  <div class="hist" id="hist"></div>
</div>

<div class="toast" id="toast"><span id="toastT"></span><button id="toastB" data-t="undo"></button></div>
<div class="loading" id="loading"><span id="loadingT"></span></div>

/* ---------- parsing ---------- */
const clean = s => (s||'').replace(/[\s ]+/g,' ').trim();

function decodeText(buf, hint){
  const bytes = new Uint8Array(buf);
  if(hint){ try{ return new TextDecoder(hint).decode(bytes); }catch(e){} }
  try{ return new TextDecoder('utf-8',{fatal:true}).decode(bytes); }catch(e){}
  try{ return new TextDecoder('windows-1251').decode(bytes); }catch(e){}
  return new TextDecoder().decode(bytes);
}

function parseTXT(text, name){
  const lines = text.replace(/\r\n?/g,'\n').split('\n');
  const blank = lines.filter(l=>!l.trim()).length;
  let paras;
  if(blank > lines.length*0.25){
    paras = text.replace(/\r\n?/g,'\n').split(/\n\s*\n/).map(clean);
  } else {
    paras = lines.map(clean);
  }
  return { title: name.replace(/\.[^.]+$/,''), author:'', blocks: paras.filter(Boolean).map(x=>({x})) };
}

function parseXML(str){
  let doc = new DOMParser().parseFromString(str,'application/xml');
  if(doc.getElementsByTagName('parsererror').length) doc = new DOMParser().parseFromString(str,'text/html');
  return doc;
}

function parseFB2(buf){
  const head = new TextDecoder('latin1').decode(new Uint8Array(buf).slice(0,300));
  const m = head.match(/encoding\s*=\s*["']([\w-]+)["']/i);
  const xml = decodeText(buf, m && m[1]);
  const doc = parseXML(xml);
  const byName = (root,n)=>Array.from(root.getElementsByTagName('*')).filter(e=>e.localName===n);
  const ti = byName(doc,'title-info')[0] || doc;
  const title = clean((byName(ti,'book-title')[0]||{}).textContent) || T('untitled');
  const au = byName(ti,'author')[0];
  const author = au ? clean(['first-name','last-name'].map(n=>(byName(au,n)[0]||{}).textContent||'').join(' ')) : '';
  const blocks = [];
  const joinKids = el => { const parts = Array.from(el.children).map(c=>clean(c.textContent)).filter(Boolean); return parts.length ? parts.join('. ').replace(/\.\./g,'.') : clean(el.textContent); };
  function walk(el){
    for(const c of el.children){
      const n = c.localName;
      if(n==='title'){ const t=joinKids(c); if(t) blocks.push({h:1,x:t}); }
      else if(n==='subtitle'){ const t=clean(c.textContent); if(t) blocks.push({h:2,x:t}); }
      else if(n==='p'||n==='v'||n==='text-author'){ const t=clean(c.textContent); if(t) blocks.push({x:t}); }
      else if(n==='empty-line'||n==='image'||n==='binary'||n==='description') {}
      else if(c.children.length) walk(c);
      else { const t=clean(c.textContent); if(t) blocks.push({x:t}); }
    }
  }
  byName(doc,'body').forEach(b=>{ const nm=(b.getAttribute('name')||'').toLowerCase(); if(nm==='notes'||nm==='comments') return; walk(b); });
  return {title, author, blocks};
}

function resolvePath(dir, href){
  href = href.split('#')[0];
  const out = [];
  (dir+href).split('/').forEach(p=>{ if(p==='..') out.pop(); else if(p&&p!=='.') out.push(p); });
  return out.join('/');
}

async function parseEPUB(buf){
  if(typeof JSZip==='undefined') throw new Error(T('noZip'));
  const zip = await JSZip.loadAsync(buf);
  const zf = p => zip.file(p) || zip.file(decodeURIComponent(p));
  const cont = zf('META-INF/container.xml');
  if(!cont) throw new Error(T('notEpub'));
  const cdoc = parseXML(await cont.async('string'));
  const rf = cdoc.getElementsByTagNameNS('*','rootfile')[0] || cdoc.getElementsByTagName('rootfile')[0];
  const opfPath = rf.getAttribute('full-path');
  const dir = opfPath.includes('/') ? opfPath.slice(0,opfPath.lastIndexOf('/')+1) : '';
  const opf = parseXML(await zf(opfPath).async('string'));
  const tag = n => Array.from(opf.getElementsByTagName('*')).filter(e=>e.localName===n);
  const title = clean((tag('title')[0]||{}).textContent) || T('untitled');
  const author = clean((tag('creator')[0]||{}).textContent);
  const man = {}; tag('item').forEach(i=>man[i.getAttribute('id')] = i.getAttribute('href'));
  const SEL = 'h1,h2,h3,h4,h5,h6,p,li,pre,blockquote,div,dt,dd,td,figcaption';
  const blocks = [];
  for(const ir of tag('itemref')){
    const href = man[ir.getAttribute('idref')]; if(!href) continue;
    const f = zf(resolvePath(dir, href)); if(!f) continue;
    const html = await f.async('string');
    let doc = new DOMParser().parseFromString(html,'application/xhtml+xml');
    if(doc.getElementsByTagName('parsererror').length) doc = new DOMParser().parseFromString(html,'text/html');
    const body = doc.body || doc.getElementsByTagNameNS('*','body')[0]; if(!body) continue;
    body.querySelectorAll('script,style,sup a[href],a.noteref').forEach(e=>e.remove());
    body.querySelectorAll('br').forEach(b=>b.replaceWith(doc.createTextNode(' ')));
    body.querySelectorAll(SEL).forEach(el=>{
      if(el.querySelector(SEL)) return;
      const n = el.localName.toLowerCase();
      const h = /^h[1-2]$/.test(n) ? 1 : /^h[3-6]$/.test(n) ? 2 : 0;
      el.textContent.split(' ').map(clean).filter(Boolean).forEach(x=>blocks.push(h?{h,x}:{x}));
    });
  }
  return {title, author, blocks};
}

async function parseFile(f){
  const low = f.name.toLowerCase();
  const buf = await f.arrayBuffer();
  if(low.endsWith('.epub')) return parseEPUB(buf);
  if(low.endsWith('.fb2')) return parseFB2(buf);
  if(low.endsWith('.zip')){
    if(typeof JSZip==='undefined') throw new Error(T('noZip'));
    const zip = await JSZip.loadAsync(buf);
    const inner = Object.values(zip.files).find(z=>!z.dir && /\.(fb2|epub|txt)$/i.test(z.name));
    if(!inner) throw new Error(T('noBookInZip'));
    const ib = await inner.async('arraybuffer');
    if(/\.fb2$/i.test(inner.name)) return parseFB2(ib);
    if(/\.epub$/i.test(inner.name)) return parseEPUB(ib);
    return parseTXT(decodeText(ib), inner.name.split('/').pop());
  }
  const text = decodeText(buf);
  if(/<FictionBook/i.test(text.slice(0,2000))) return parseFB2(buf);
  return parseTXT(text, f.name);
}

/* upload */
function makeChunks(blocks){
  const chunks = [], starts = []; let cur = [], size = 0;
  blocks.forEach((b,i)=>{
    if(!cur.length) starts.push(i);
    cur.push(b.h ? {h:b.h, x:b.x} : {x:b.x}); size += b.x.length;
    if(size >= CHUNK_CHARS){ chunks.push(cur); cur = []; size = 0; }
  });
  if(cur.length) chunks.push(cur);
  return {chunks, starts};
}
async function uploadBook(res){
  if(!res.blocks.length) throw new Error(T('noText'));
  const {chunks, starts} = makeChunks(res.blocks);
  const id = crypto.randomUUID();
  const title = (res.title||T('untitled')).slice(0,500), author = (res.author||'').slice(0,300);
  let {error} = await sb.from('books').insert({id, title, author, block_count:res.blocks.length, chunk_starts:starts, ready:false});
  if(error) throw error;
  const BATCH = 8;
  for(let i=0;i<chunks.length;i+=BATCH){
    loading(true, T('uploading',{p:Math.min(100, Math.round(i/chunks.length*100))}));
    const rows = chunks.slice(i,i+BATCH).map((c,j)=>({book_id:id, idx:i+j, blocks:c}));
    ({error} = await sb.from('chunks').insert(rows));
    if(error){ await sb.from('books').delete().eq('id', id); throw error; }
  }
  ({error} = await sb.from('books').update({ready:true}).eq('id', id));
  if(error) throw error;
  return {id, owner:me.id, title, author, block_count:res.blocks.length, chunk_starts:starts, ready:true, mark:null};
}

/* ---------- reader ---------- */
let book = null;           // {id, owner, title, block_count, chunk_starts, mark, isOwner}
let cache = new Map();     // chunk idx -> blocks
let lo = 0, hi = -1;       // rendered chunk range
let busy = false;

const chunkOf = b => { const s = book.chunk_starts; let l=0, r=s.length-1; while(l<r){ const m=(l+r+1)>>1; if(s[m]<=b) l=m; else r=m-1; } return l; };
const blockText = i => { const c = chunkOf(i), d = cache.get(c); return d ? (d[i-book.chunk_starts[c]]||{x:''}).x : ''; };
const blockEl = i => textEl.querySelector(`[data-i="${i}"]`);

async function fetchChunk(c){
  if(cache.has(c)) return cache.get(c);
  for(let attempt=0; attempt<30; attempt++){
    const {data, error} = await sb.rpc('get_chunk', {bid:book.id, i:c});
    if(!error){ const d = data || []; cache.set(c, d); return d; }
    if(/slow_down/.test(error.message)){ await sleep(4000); if(!book) return null; continue; }
    throw new Error(/too_far_ahead/.test(error.message) ? T('tooFar') : error.message);
  }
  throw new Error(T('noChunk'));
}
function chunkNode(c){
  const sec = document.createElement('section'); sec.dataset.c = c;
  const start = book.chunk_starts[c];
  cache.get(c).forEach((b,j)=>{
    const el = document.createElement(b.h===1?'h2':b.h===2?'h3':'p');
    el.dataset.i = start+j; el.textContent = b.x; sec.appendChild(el);
  });
  return sec;
}
function endNode(){
  const p = document.createElement('p'); p.className='more'; p.id='tail';
  p.textContent = hi >= book.chunk_starts.length-1 ? T('end') : T('more');
  return p;
}
async function renderAround(c){
  busy = true;
  await fetchChunk(c);
  lo = hi = c;
  textEl.replaceChildren(chunkNode(c), endNode());
  paintMark();
  busy = false;
  maybeLoad();
}
async function maybeLoad(){
  if(!book || busy) return;
  const H = document.documentElement.scrollHeight, y = window.scrollY;
  try{
    if(H - (y + innerHeight) < innerHeight*1.5 && hi < book.chunk_starts.length-1){
      busy = true;
      const id = book.id;
      await fetchChunk(hi+1);
      if(!book || book.id !== id){ busy=false; return; }
      hi++;
      $('#tail').before(chunkNode(hi));
      $('#tail').textContent = hi >= book.chunk_starts.length-1 ? T('end') : T('more');
      busy = false; return maybeLoad();
    }
    if(y < innerHeight && lo > 0){
      busy = true;
      const id = book.id;
      await fetchChunk(lo-1);
      if(!book || book.id !== id){ busy=false; return; }
      lo--;
      const before = document.documentElement.scrollHeight;
      textEl.prepend(chunkNode(lo));
      window.scrollBy(0, document.documentElement.scrollHeight - before);
      busy = false; return maybeLoad();
    }
  }catch(err){ busy = false; toast(err.message); }
}

function paintMark(){

/* tap a word */
function caretAt(x,y){
  if(document.caretPositionFromPoint){ const p = document.caretPositionFromPoint(x,y); return p && {node:p.offsetNode, off:p.offset}; }
  if(document.caretRangeFromPoint){ const r = document.caretRangeFromPoint(x,y); return r && {node:r.startContainer, off:r.startOffset}; }
  return null;
}
const isW = ch => !!ch && /[\p{L}\p{N}́'’\-]/u.test(ch);
function wordAt(x,y){
  const c = caretAt(x,y); if(!c || !c.node) return null;
  let node = c.node, off = c.off;
  if(node.nodeType !== 3){
    const k = node.childNodes[Math.min(off, node.childNodes.length-1)];
    if(!k) return null;
    node = k.nodeType===3 ? k : (k.firstChild && k.firstChild.nodeType===3 ? k.firstChild : null);
    off = 0; if(!node) return null;
  }
  const block = node.parentElement && node.parentElement.closest('[data-i]');
  if(!block || !textEl.contains(block)) return null;
  let g = 0; const tw = document.createTreeWalker(block, NodeFilter.SHOW_TEXT); let n;
  while((n = tw.nextNode())){ if(n === node){ g += off; break; } g += n.data.length; }
  const i = +block.dataset.i, s = blockText(i);
  let a = g;
  if(!isW(s[a]) && isW(s[a-1])) a = a-1;
  if(!isW(s[a])) return null;
  let b = a;
  while(a>0 && isW(s[a-1])) a--;
  while(b<s.length && isW(s[b])) b++;
  while(a<b && /[\-'’]/.test(s[a])) a++;
  while(b>a && /[\-'’]/.test(s[b-1])) b--;
  const w = s.slice(a,b);
  if(!/[\p{L}\p{N}]/u.test(w) || w.length > 200) return null;
  return {b:i, o:a, e:b, w};
}

async function saveMark(hit){
  const {data, error} = await sb.from('marks').insert({book_id:book.id, b:hit.b, o:hit.o, e:hit.e, w:hit.w}).select('id,created_at').single();
  if(error) throw error;
  return data;
}
textEl.addEventListener('click', async e=>{
  if(!book) return;
  const sel = window.getSelection && String(window.getSelection());
  if(sel && sel.length) return;
  const hit = wordAt(e.clientX, e.clientY); if(!hit) return;
  const wasAuto = auto; stopAuto();
  const prev = book.mark;
  const bid = book.id;
  book.mark = Object.assign({}, hit, {created_at:new Date().toISOString()});
  paintMark(); pulse(); $('#top').classList.remove('hide');
  toast(T('marked',{w:hit.w}) + (wasAuto?T('paused'):''), async ()=>{
    const row = cur; if(book && book.id===bid){ book.mark = prev; paintMark(); }
    if(row && row.id) await sb.from('marks').delete().eq('id', row.id);
  });
  const cur = book.mark;
  try{ const r = await saveMark(hit); Object.assign(cur, r); }
  catch(err){ if(book && book.mark===cur){ book.mark = prev; paintMark(); } toast(T('markErr')+(err.message||T('offline'))); }
});

/* history */
async function renderHist(){
  $('#hist').innerHTML = `<div class="meta">${T('loading')}</div>`;
  const {data, error} = await sb.from('marks').select('id,b,o,e,w,created_at').eq('book_id', book.id).order('created_at',{ascending:false}).limit(100);
  if(error){ $('#hist').innerHTML = `<div class="meta">${esc(error.message)}</div>`; return; }
  histRows = data || [];
  if(!histRows.length){ $('#hist').innerHTML = `<div class="meta">${T('noMarks')}</div>`; return; }
  $('#hist').innerHTML = histRows.map((m,k)=>{
    const s = blockText(m.b);
    const pct = Math.max(1, Math.round((m.b+1)/book.block_count*100));
    const cur = k===0;
    const snip = s ? `${m.o>50?'…':''}${esc(s.slice(Math.max(0,m.o-50), m.o))}<mark>${esc(m.w)}</mark>${esc(s.slice(m.e, m.e+50))}${m.e+50<s.length?'…':''}` : `<mark>${esc(m.w)}</mark>`;
    return `<button class="h${cur?' cur':''}" data-k="${k}"><div class="s">${snip}</div><div class="d">${fmtDate(m.created_at)} · ${pct}%${cur?T('current'):''}</div></button>`;
  }).join('');
}
let histRows = [];
$('#hist').addEventListener('click', async e=>{
  const b = e.target.closest('.h'); if(!b) return;
  const m = histRows[+b.dataset.k]; closeSheets();
  if(+b.dataset.k !== 0){
    book.mark = {b:m.b, o:m.o, e:m.e, w:m.w, created_at:new Date().toISOString()};
    saveMark(m).catch(err=>toast(T('markErr')+err.message));
  }
  paintMark();
  setTimeout(jumpToMark, 250);
});

/* sheets */
function openSheet(id){ stopAuto(); $('#back').classList.add('on'); $(id).classList.add('on'); }
function closeSheets(){ $('#back').classList.remove('on'); document.querySelectorAll('.sheet').forEach(s=>s.classList.remove('on')); }
$('#back').addEventListener('click', closeSheets);
$('#setBtn').addEventListener('click', ()=>openSheet('#setSheet'));
$('#histBtn').addEventListener('click', ()=>{ openSheet('#histSheet'); renderHist(); });

/* scroll */
let lastY = 0, holdBar = 0, scrollRaf = 0;
function onScroll(){
  if(!book) return;
  const y = window.scrollY;
  if(!scrollRaf) scrollRaf = requestAnimationFrame(()=>{
    scrollRaf = 0; if(!book) return;
    const el = document.elementFromPoint(innerWidth/2, innerHeight*0.4);
    const blk = el && el.closest && el.closest('[data-i]');
    if(blk) $('#progI').style.width = Math.min(100, (+blk.dataset.i+1)/book.block_count*100) + '%';
    maybeLoad();
  });
  if(Date.now() < holdBar){ lastY = y; return; }
  if(auto || (y > lastY+6 && y > 100)) $('#top').classList.add('hide');
  else if(y < lastY-6 || y < 100) $('#top').classList.remove('hide');
  lastY = y;
}
addEventListener('scroll', onScroll, {passive:true});

/* auto-scroll */
let auto = false, lastT = 0, acc = 0, wake = null;
const PLAY = '<path d="M8 5.5v13l10.5-6.5z" fill="currentColor"/>';
const PAUSE = '<path d="M8 5v14M16 5v14" stroke-width="3"/>';
function loop(t){
  if(!auto) return;
  if(lastT){ acc += SPEEDS[S.speed] * Math.min(100, t-lastT) / 1000; const step = Math.floor(acc); if(step>=1){ window.scrollBy(0, step); acc -= step; } }
  lastT = t;
  if(window.scrollY + innerHeight >= document.documentElement.scrollHeight - 2 && hi >= book.chunk_starts.length-1){ stopAuto(); return; }
  requestAnimationFrame(loop);
}
async function startAuto(){
  auto = true; lastT = 0; acc = 0; $('#playIco').innerHTML = PAUSE; $('#top').classList.add('hide');
  requestAnimationFrame(loop);
  try{ if(navigator.wakeLock) wake = await navigator.wakeLock.request('screen'); }catch(e){}
}
function stopAuto(){
  if(!auto) return;
  auto = false; $('#playIco').innerHTML = PLAY;
  try{ wake && wake.release(); }catch(e){} wake = null;
}
$('#playBtn').addEventListener('click', ()=> auto ? stopAuto() : startAuto());
$('#slower').addEventListener('click', ()=>{ S.speed = Math.max(0, S.speed-1); applySettings(); });
$('#faster').addEventListener('click', ()=>{ S.speed = Math.min(SPEEDS.length-1, S.speed+1); applySettings(); });
document.addEventListener('visibilitychange', ()=>{ if(document.hidden) stopAuto(); });

/* protection for shared books */
function buildWatermark(){
  const wm = $('#wm'); wm.replaceChildren();
  if(!book || book.isOwner) return;
  const label = me.email + ' · ' + new Date().toLocaleDateString(LOC());
  for(let r=0; r<14; r++) for(let c=0; c<4; c++){
    const d = document.createElement('div'); d.textContent = label;
    d.style.top = (r*120 - 60) + 'px'; d.style.left = (c*320 - 120 + (r%2)*160) + 'px';
    wm.appendChild(d);
  }
}
['copy','cut','contextmenu','dragstart','selectstart'].forEach(ev=>document.addEventListener(ev, e=>{
  if(document.body.classList.contains('guard') && e.target.closest && e.target.closest('#text')) e.preventDefault();
}));
document.addEventListener('keydown', e=>{
  if(document.body.classList.contains('guard') && (e.ctrlKey||e.metaKey) && /^[acsp]$/i.test(e.key)) e.preventDefault();
});

/* toast */
let tTimer = null, tUndo = null;
function toast(msg, undo){
  $('#toastT').textContent = msg; tUndo = undo || null;
  $('#toastB').style.display = undo ? '' : 'none';
  $('#toast').classList.add('on');
  clearTimeout(tTimer); tTimer = setTimeout(()=>$('#toast').classList.remove('on'), undo ? 4000 : 3500);
}
$('#toastB').addEventListener('click', ()=>{ if(tUndo){ tUndo(); tUndo = null; } $('#toast').classList.remove('on'); });

applySettings();
})();
</script>
